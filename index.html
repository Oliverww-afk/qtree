<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F7F4ED">
  <meta name="description" content="写一句你卡住的事，三问之后得到一条今天、这周、定下来之前都能用的路线。">
  <meta name="application-name" content="问题树">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="问题树">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <title>问题树｜先说你卡在哪</title>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">问题树</div>
      <div class="dots" id="dots" aria-label="进度">
        <span class="dot" data-dot="1"></span>
        <span class="dot" data-dot="2"></span>
        <span class="dot" data-dot="3"></span>
      </div>
      <button class="back" id="back" type="button" aria-label="返回上一步">返回</button>
    </header>

    <main>
      <section class="screen active" id="screen-entry" aria-labelledby="entryTitle">
        <h1 class="cover-title" id="entryTitle">先说你卡在哪。</h1>
        <div class="entry-card" id="entryCard">
          <input class="entry" id="entry" type="text" maxlength="80" autocomplete="off" placeholder="一句话就够" aria-label="一句话说你现在卡住的事">
          <button class="primary" id="start" type="button">开始</button>
          <button class="text-action" id="example" type="button">用示例走一遍</button>
        </div>
        <p class="privacy">只存在这台设备上。</p>
      </section>

      <section class="screen" id="screen-q1" aria-labelledby="q1Title">
        <p class="quote" id="q1Quote"></p>
        <h2 class="q-title" id="q1Title">你现在处在哪一步？</h2>
        <div class="options" id="q1Options"></div>
      </section>

      <section class="screen" id="screen-q2" aria-labelledby="q2Title">
        <p class="quote" id="q2Quote"></p>
        <h2 class="q-title" id="q2Title">最卡你的是哪一样？</h2>
        <div class="options" id="q2Options"></div>
      </section>

      <section class="screen" id="screen-q3" aria-labelledby="q3Title">
        <p class="quote" id="q3Quote"></p>
        <h2 class="q-title" id="q3Title">今晚，你愿意先做哪一件？</h2>
        <div class="options" id="q3Options"></div>
      </section>

      <section class="screen" id="screen-route" aria-labelledby="routeTitle">
        <div class="route-head">
          <p class="context" id="routeContext"></p>
          <h2 class="route-title" id="routeTitle">这 3 个问题，<br>知乎上都有人答过。</h2>
          <p class="route-meta" id="routeMeta"></p>
        </div>
        <div class="stations" id="stations"></div>
      </section>

      <section class="screen" id="screen-feedback" aria-labelledby="feedbackTitle">
        <p class="feedback-quote" id="feedbackQuote"></p>
        <h2 class="feedback-title" id="feedbackTitle">看完这条，你更偏哪边？</h2>
        <div class="feedback-options" id="feedbackOptions"></div>
      </section>

      <section class="screen" id="screen-takeaway" aria-labelledby="takeTitle">
        <p class="take-head" id="takeMeta"></p>
        <h2 class="take-title" id="takeTitle">带走这三个问题。</h2>
        <ol class="take-list" id="takeList"></ol>
        <div class="take-actions">
          <button class="primary" id="copyBtn" type="button">复制</button>
          <button class="secondary" id="saveBtn" type="button">存成图片</button>
        </div>
        <p class="take-footer">答案在知乎，这里只把问题收窄。</p>
      </section>
    </main>
  </div>

  <div class="crisis" id="crisis" hidden role="dialog" aria-modal="true" aria-labelledby="crisisTitle">
    <div class="crisis-card">
      <h2 id="crisisTitle">先停一下。</h2>
      <p>如果你现在有伤害自己的念头，请先联系：</p>
      <ul>
        <li>120 急救</li>
        <li>110 报警</li>
        <li>心理援助热线 12356</li>
      </ul>
      <p>这里不继续追问。先找身边可信任的人陪着。</p>
      <button id="crisisBack" type="button">回到入口</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
