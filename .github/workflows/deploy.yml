name: Import qtree P1 source (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-qtree
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Download P1 package
        run: |
          curl -L --fail 'https://aka.doubaocdn.com/s/uKAUAFbWJB' -o /tmp/qtree.zip
          unzip -o /tmp/qtree.zip \
            index.html style.css app.js data.js config.js compiler.js llm.js \
            manifest.webmanifest sw.js server.js worker.js README.md .env.example .gitignore \
            'icons/*' -d .
      - name: Commit imported site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Import qtree P1 source [skip ci]"
            git push
          fi
