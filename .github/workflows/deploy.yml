name: Import qtree v2.1 source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-qtree
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Check whether v2.1 is already in the repository
        id: check
        run: |
          if [ -f config.js ] && [ -f compiler.js ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Download package
        if: steps.check.outputs.exists != 'true'
        run: |
          curl -L --fail 'https://aka.doubaocdn.com/s/PWWnkqCHMJ' -o /tmp/qtree.zip
          unzip -o /tmp/qtree.zip \
            index.html style.css app.js data.js config.js compiler.js llm.js \
            manifest.webmanifest sw.js server.js worker.js README.md .env.example \
            'icons/*' -d .
      - name: Commit imported site
        if: steps.check.outputs.exists != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Import qtree v2.1 source [skip ci]"
            git push
          fi
